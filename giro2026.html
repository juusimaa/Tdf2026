const REST_AFTER = {3:'2026-05-11', 9:'2026-05-18', 15:'2026-05-25'};
function climbHeight(c){ // illustrative peak height 40–95 from length × gradient
  const gain=(c.len||4)*(c.grad||5); // ~ metres/10
  return Math.max(40, Math.min(95, 36 + gain*0.4));
}
function genProfile(st){
  const cs=climbsWithKm(st);
  if(st.type==='itt' || !cs.length) return genericProfile(st);
  const total=st.km, pts=[[0,18]];
  let last=0;
  cs.forEach(c=>{
    const foot=Math.max(last+1, Math.max(1, c.km-(c.len||4)));
    if(foot>last+1) pts.push([+foot.toFixed(1),22]);
    pts.push([c.km, climbHeight(c)]);
    if(c.km < total-4) pts.push([+Math.min(total, c.km+Math.max(3,(c.len||4)*0.5)).toFixed(1),28]);
    last=c.km;
  });
  const lastPt=pts[pts.length-1];
  if(lastPt[0] < total-0.5) pts.push([total, st.summit?90:18]);
  else if(st.summit) lastPt[1]=Math.max(lastPt[1],90);
  // enforce strictly increasing x
  const out=[];
  pts.forEach(p=>{ const x=Math.max(0,Math.min(total,p[0])); if(!out.length || x>out[out.length-1][0]) out.push([+x.toFixed(1),p[1]]); });
  return out;
}
function buildPath(points,totalKm,W,H,padL,padR,padT,padB){
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xs=points.map(p=>padL+(p[0]/totalKm)*plotW);
  const ys=points.map(p=>padT+plotH-(p[1]/100)*plotH);
  let d=`M ${xs[0]},${ys[0]}`;
  for(let i=1;i<xs.length;i++){ const mx=(xs[i-1]+xs[i])/2; d+=` Q ${xs[i-1]},${ys[i-1]} ${mx},${(ys[i-1]+ys[i])/2}`; }
  d+=` L ${xs[xs.length-1]},${ys[ys.length-1]}`;
  return {d,plotH};
}
function xForKm(km,totalKm,W,padL,padR){ return padL+(km/totalKm)*(W-padL-padR); }
const STAGE_COORDS = {
  1:[[27.73,42.66],[27.47,42.51]],  2:[[27.47,42.51],[25.62,43.08]],

function winnerFor(n){
  if(!RESULTS || !Array.isArray(RESULTS.stageWinners)) return '';
  const w=RESULTS.stageWinners.find(x=>x.n===n);
  return w ? (w.winner||'') : '';
}
function genDesc(st){
  const sep = lang==='fr' ? ' : ' : ': ';
  const parts=[`${t('typeDesc')[st.type]}${sep}${esc(st.start)} → ${esc(st.finish)}, ${fmtKm(st.km)}.`];
  if(st.summit) parts.push(esc(t('summitNote')(st.summit)));
  const w=winnerFor(st.n);
  if(w) parts.push(esc(t('winnerNote')(w)));
  return '<p>'+parts.join(' ')+'</p>';
}

/* ---------- ELEVATION PROFILE ----------
   Built from genProfile(st) (illustrative shape from climb positions/type —
   see the profile-generation helpers above), styled per the Modernist
   system: monochrome ink line/fill, accent-shade climb bands, dashed accent
   sprint flag. Only climbs with a known summit km get a marker, matching
   the original site's behaviour (see climbsWithKm). */
function renderProfile(st){
  const W=900, H=250, padL=30, padR=16, padT=22, padB=30;
  const {d, plotH} = buildPath(genProfile(st), st.km, W,H,padL,padR,padT,padB);
  const baseY = padT+plotH;

  let svg = `<svg class="profile" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(t('profileAria')(st.n))}">`;

  for(let g=0; g<=4; g++){
    const gy = padT + plotH*g/4;
    svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--color-neutral-300)" stroke-width="1"/>`;
  }
  const step = st.km > 150 ? 50 : (st.km > 60 ? 20 : 10);
  for(let k=0; k<=st.km+0.01; k+=step){
    const kx = xForKm(k, st.km, W, padL, padR);
    svg += `<line x1="${kx}" y1="${padT}" x2="${kx}" y2="${baseY}" stroke="var(--color-neutral-200)" stroke-width="1"/>`;
    svg += `<text x="${kx}" y="${H-10}" font-family="Archivo, sans-serif" font-size="11" font-weight="600" fill="var(--color-neutral-600)" text-anchor="middle">${Math.round(k)}</text>`;
  }

  climbsWithKm(st).forEach(c=>{
    const cx = xForKm(c.km, st.km, W, padL, padR);
    const foot = xForKm(Math.max(0, c.km-(c.len||4)), st.km, W, padL, padR);
    const col = CAT_COLOR[c.cat] || UNCAT_COLOR;
    svg += `<rect x="${foot}" y="${padT}" width="${Math.max(2,cx-foot)}" height="${plotH}" fill="${col}" opacity="0.18"/>`;
    svg += `<line x1="${cx}" y1="${padT}" x2="${cx}" y2="${baseY}" stroke="${col}" stroke-width="2"/>`;
    svg += `<rect x="${cx-4}" y="${padT-12}" width="8" height="8" fill="${col}"/>`;
  });

  svg += `<path d="${d} L ${xForKm(st.km,st.km,W,padL,padR)},${baseY} L ${padL},${baseY} Z" fill="var(--color-text)" opacity="0.1"/>`;
  svg += `<path d="${d}" fill="none" stroke="var(--color-text)" stroke-width="2.5" stroke-linejoin="round"/>`;

  (st.sprints||[]).forEach(s=>{
    const sx = xForKm(s.km, st.km, W, padL, padR);
    const top = padT + plotH*0.28;
    svg += `<line x1="${sx}" y1="${top}" x2="${sx}" y2="${baseY}" stroke="var(--color-accent)" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    svg += `<path d="M ${sx} ${top} L ${sx+14} ${top+5} L ${sx} ${top+10} Z" fill="var(--color-accent)"/>`;
  });

  svg += `<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--color-text)" stroke-width="2"/>`;
  svg += `</svg>`;
  return svg;
}

const ZOOM_LABELS = {fi:{in:'Lähennä',out:'Loitonna'}, fr:{in:'Zoom avant',out:'Zoom arrière'}, en:{in:'Zoom in',out:'Zoom out'}};

/* ---------- REAL ROUTE MAP (Leaflet + Stadia Maps) ----------
   Per-stage route polylines live in data/giro2026-routes.json. Stages
   missing a route fall back to a straight start→finish line derived from
   STAGE_COORDS. Same restyled-Leaflet approach as the Tour de France page
   (see design_handoff_tdf2026/): the design's flat SVG map was traded for
   this real interactive tile map; the control-row chrome is kept. */
let routesData = null, routesPromise = null;

let stageMap = null, stageMapFitBounds = null;

function initStageMap(st){
  if(!window.L){ setTimeout(()=>initStageMap(st), 120); return; }
  const el = document.getElementById('stage-map');
  if(!el) return;
  destroyStageMap();

  const map = L.map(el, {scrollWheelZoom:false, attributionControl:true, zoomControl:false});
  stageMap = map;
  L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', {
    maxZoom:17,
    attribution:'&copy; <a href="https://www.stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.on('zoomend', updateMapZoomLabel);

  const css = getComputedStyle(document.documentElement);
  const INK = css.getPropertyValue('--color-text').trim() || '#201e1d';
  const ACCENT = css.getPropertyValue('--color-accent').trim() || '#ec3013';

  const draw = () => {
    if(stageMap !== map) return;
    const pts = (routesData.stages || {})[st.n];
    const c = STAGE_COORDS[st.n];
    let line, startLL, finishLL, approx = false;
    if(pts && pts.length){
      line = pts; startLL = pts[0]; finishLL = pts[pts.length-1];
    }else{
      approx = true;
      startLL = [c[0][1], c[0][0]];
      finishLL = [c[1][1], c[1][0]];
      line = [startLL, finishLL];
    }
    const poly = L.polyline(line, approx
      ? {color:INK, weight:3, opacity:.85, dashArray:'6,8'}
      : {color:INK, weight:3.5, opacity:.95}).addTo(map);
    const same = Math.abs(startLL[0]-finishLL[0])<1e-4 && Math.abs(startLL[1]-finishLL[1])<1e-4;
    if(!same){
      L.circleMarker(startLL, {radius:6, color:'#fff', weight:2, fillColor:INK, fillOpacity:1}).addTo(map);
    }
    L.circleMarker(finishLL, {radius:7, color:'#fff', weight:2, fillColor:ACCENT, fillOpacity:1}).addTo(map);
    map.fitBounds(poly.getBounds(), {padding:[24,24]});
    map.invalidateSize();
    stageMapFitBounds = () => { if(stageMap===map) map.fitBounds(poly.getBounds(), {padding:[24,24]}); };
    const cap = document.getElementById('stage-map-caption');
    if(cap) cap.textContent = approx ? t('minimapCaptionApprox') : t('minimapCaption');
    updateMapZoomLabel();
  };

  if(routesData) draw(); else loadRoutes().then(()=>{ if(stageMap===map) draw(); });
  setTimeout(()=>{ if(stageMap===map) map.invalidateSize(); }, 60);
}

  let html =

    `<button class="mapctrl-btn" data-map-zoomin title="${zl.in}" aria-label="${zl.in}">+</button>` +
    `<button class="mapctrl-btn" data-map-recenter title="${esc(t('minimapRecenter'))}" aria-label="${esc(t('minimapRecenter'))}">◎</button>`;

/* ---------- STAGE LIST ---------- */
let activeIdx = 0;
function renderStageList(){
  const listEl = document.getElementById('stageList');
  const stagelayout = document.querySelector('.stagelayout');
  const panel = document.getElementById('panel');
  if(panel && stagelayout && listEl.contains(panel)) stagelayout.appendChild(panel);
  listEl.innerHTML = '';
  stages.forEach((s, idx)=>{
    const li = document.createElement('li');
    li.className = 'stage-item';
    const btn = document.createElement('button');
    btn.className = 'stage-btn' + (idx===activeIdx ? ' active' : '');
    btn.dataset.idx = idx;
    btn.innerHTML = `
      <span class="num">${String(s.n).padStart(2,'0')}</span>
      <span class="btn-text">
        <span class="btn-route">${esc(s.start)} → ${esc(s.finish)}</span>
        <span class="btn-meta">${fmtDate(s.date)} · ${fmtKm(s.km)} · ${t('typeLabels')[s.type]}</span>
      </span>`;
    btn.addEventListener('click', ()=>selectStage(idx));
    li.appendChild(btn);
    listEl.appendChild(li);
    if(REST_AFTER[s.n]){
      const rli = document.createElement('li');
      rli.className = 'stage-item';
      const div = document.createElement('div');
      div.className = 'rest-row';
      div.textContent = `${fmtDate(REST_AFTER[s.n])} · ${t('restDay')}`;
      rli.appendChild(div);
      listEl.appendChild(rli);
    }
  });
  positionPanel();
}

/* Keeps the stage-rail column exactly as tall as the detail panel next to
   it — see the equivalent comment in tdf2026.html. Skipped below 980px. */
function syncStageListHeight(){
  const list = document.querySelector('.stagerail');
  const panel = document.getElementById('panel');
  const stagesView = document.getElementById('view-stages');
  if(!list || !panel || !stagesView) return;
  if(window.innerWidth<=980 || !stagesView.classList.contains('active')){
    list.style.height = '';
    return;
  }
  list.style.height = panel.offsetHeight + 'px';
}
window.addEventListener('resize', ()=>{ syncStageListHeight(); positionPanel(); });

/* Below the 980px breakpoint the detail panel has no side column to live in,
   so it's moved into the stage list right after the selected stage's row —
   otherwise it renders below the entire list, far from the row that opened
   it. Above the breakpoint it moves back into its own grid column. */

function selectStage(idx){
  activeIdx = idx;
  document.querySelectorAll('.stage-btn').forEach(b=>b.classList.toggle('active', +b.dataset.idx===idx));
  const b = document.querySelector(`.stage-btn[data-idx="${idx}"]`);
  if(b) b.scrollIntoView({block:'nearest'});
  renderPanel(stages[idx]);
  positionPanel();
  syncStageListHeight();
}

  const w = winnerFor(st.n);

  panel.innerHTML = `

    </div>

    <div class="factrow">
      <div class="factcell"><span class="label">${t('factDistance')}</span><span class="value">${fmtKm(st.km)}</span></div>
      <div class="factcell"><span class="label">${t('factType')}</span><span class="value">${t('typeLabels')[st.type]}</span></div>
      <div class="factcell"><span class="label">${t('factGain')}</span><span class="value">${st.gain ? fmtGain(st.gain) : '—'}</span></div>
      <div class="factcell"><span class="label">${t('factWinner')}</span><span class="value" style="color:var(--color-accent-700)">${w ? esc(w) : '—'}</span></div>
    </div>

    ${mapExpanded ? bigMapBoxHTML(st) : ''}

    <div class="detailgrid${mapExpanded ? ' big' : ''}">
      ${mapExpanded ? '' : `<div class="mapcell">${mapCellHTML(st)}</div>`}
      <div class="profilecell">
        <span class="label">${profileLabel()}</span>
        ${renderProfile(st)}
        <div class="legend">
          <span class="legenditem"><span class="legswatch" style="background:${CAT_COLOR[1]}"></span>${t('legCat')} 1</span>
          <span class="legenditem"><span class="legswatch" style="background:${CAT_COLOR[2]}"></span>2</span>
          <span class="legenditem"><span class="legswatch" style="background:${CAT_COLOR[3]}"></span>3</span>
          <span class="legenditem"><span class="legswatch" style="background:${CAT_COLOR[4]}"></span>4</span>
          <span class="legenditem"><span class="legswatch" style="background:${UNCAT_COLOR}"></span>${t('legUncat')}</span>
          <span class="legenditem"><span class="legswatch" style="background:var(--color-accent)"></span>${t('legSprint')}</span>
        </div>
        <span class="chart-caption">${t('chartCaption')}</span>
      </div>
    </div>

    <div class="detailbody">
      <div>
        <h3>${t('descHeader')}</h3>
        <div class="prose">${genDesc(st)}</div>
      </div>
      <div>
        <h3>${t('climbsHeader')}</h3>
        ${climbRows
          ? `<table class="dtable"><thead><tr><th>${t('climbHead')[0]}</th><th>${t('climbHead')[1]}</th><th>${t('climbHead')[2]}</th><th>${t('climbHead')[3]}</th><th>${t('climbHead')[4]}</th></tr></thead><tbody>${climbRows}</tbody></table>`
          : `<p class="empty-note">${t('noClimbs')}</p>`}
      </div>
      <div>
        <h3>${t('sprintsHeader')}</h3>
        ${sprintRows
          ? `<table class="dtable sprints"><thead><tr><th>${t('sprintHead')[0]}</th><th>${t('sprintHead')[1]}</th></tr></thead><tbody>${sprintRows}</tbody></table>`
          : `<p class="empty-note">${t('noSprints')}</p>`}
      </div>
    </div>
  `;

  bindMapControls(st);
  initStageMap(st);
}
/* Jersey swatch colours: the site's own established maglia hexes (theme.css
   --rosa/--ciclamino/--azzurra/--bianca), not Modernist tokens — the system
   has one accent, so real jersey colours are content, same treatment as the
   hub's flag stripes. Teams uses a neutral token instead of --grey (which
   equals --bianca in theme.css) so it reads as a distinct swatch. */
const CLASSES = [
  {key:'gc',        nameKey:'gcName',     jerseyKey:'gcJersey',     colour:'#D6497F',                cols:'time'},
  {key:'points',    nameKey:'pointsName', jerseyKey:'pointsJersey', colour:'#8E4BB0',                cols:'pts'},
  {key:'mountains', nameKey:'momName',    jerseyKey:'momJersey',    colour:'#2E7CBF',                cols:'pts'},
  {key:'youth',     nameKey:'youthName',  jerseyKey:'youthJersey',  colour:'#8B8F84',                cols:'time'},
  {key:'teams',     nameKey:'teamsName',  jerseyKey:'teamsJersey',  colour:'var(--color-neutral-700)', cols:'time', team:true},
];

/* Per-card divider borders in a 2-col grid: right rule on the left card of
   each pair, bottom rule on every row but the last (same formula as the
   design's own cardStyle — see tdf2026.html). */

function riderCell(row, teamOnly){
  if(teamOnly) return `<span class="rname">${esc(row.rider)}</span>`;
  return `<span class="rname">${esc(row.rider)}</span>${row.team?`<span class="rteam">${esc(row.team)}${row.nat?' · '+esc(row.nat):''}</span>`:''}`;
}

/* Leader's row shows the absolute time/points value; every other row shows
   the gap to the leader where one exists (points classifications have no
   gap field, so this naturally falls back to the points value for them). */
function classRowHTML(r, teamOnly){
  const val = r.gap!==undefined && r.pos>1 ? r.gap : r.val;
  return `<tr class="${r.pos<=3?'podium':''}">
    <td class="pos">${esc(r.pos)}</td>
    <td class="rider">${riderCell(r, teamOnly)}</td>
    <td class="val">${esc(val)}</td>
  </tr>`;
}

function classCard(cfg, i, n){
  const rows = (RESULTS && RESULTS[cfg.key] && RESULTS[cfg.key].rows) || [];
  const body = `<table class="results"><tbody>${rows.map(r=>classRowHTML(r, cfg.team)).join('')}</tbody></table>`;
  return `<div class="cls-card" style="${cardBorderStyle(i, n)}">
    <div class="cls-head">
      <span class="names"><span class="name">${esc(t(cfg.nameKey))}</span><span class="fr">${esc(t(cfg.jerseyKey))}</span></span>
      <span class="swatch" style="background:${cfg.colour}"></span>
    </div>
    <div class="cls-body">${body}</div>
  </div>`;
}

function renderResults(){
  document.getElementById('classHeading').textContent = t('classHeading');
  document.getElementById('classGrid').innerHTML = CLASSES.map((cfg,i)=>classCard(cfg, i, CLASSES.length)).join('');

  document.getElementById('stagesHeading').textContent = t('stagesHeading');
  const winners = (RESULTS && RESULTS.stageWinners) || [];
  const gcWinner = (RESULTS && RESULTS.gc && RESULTS.gc.rows[0] && RESULTS.gc.rows[0].rider) || '';
  document.getElementById('stagesTbody').innerHTML = winners.map(w=>{
    const pink = w.winner && w.winner===gcWinner;
    return `<tr class="${pink?'pink':''}">
      <td class="n">${esc(w.n)}</td>
      <td class="route">${esc(w.route||'')}</td>
      <td class="winner">${esc(w.winner||'')}</td>
    </tr>`;
  }).join('');
}

/* ---------- TEAMS & RIDERS ----------
   Start list (23 teams x 8 riders) with each rider's final GC place, from
   data/giro2026-riders.json. giroditalia.it publishes no reason codes beyond
   DNF, so the sub line always reads "Abandoned (DNF)" for a rider who left —
   folded under the name rather than a separate badge, matching tdf2026.html. */
function riderRowHTML(r){
  const out = !r.gcPos;
  const sub = out
    ? `${t('dnfTitle')} · ${r.statusStage ? t('riderOutOnStage')(r.statusStage) : t('riderOutUnknown')}`
    : (r.nat || '');
  const gcPos = out ? '—' : esc(r.gcPos);
  const val = out ? '' : esc(r.gcGap || r.gcVal || '');
  return `
    <tr class="${out ? 'out' : (r.gcPos<=3 ? 'podium' : '')}">
      <td class="bib">${esc(r.bib||'')}</td>
      <td class="rider"><span class="rname">${esc(r.name)}</span>${sub?`<span class="rsub">${esc(sub)}</span>`:''}</td>
      <td class="gcpos">${gcPos}</td>
      <td class="val">${val}</td>
    </tr>`;
}

function teamCard(team, i, n){
  const nameHTML = team.url
    ? `<a class="team-link" href="${esc(team.url)}" target="_blank" rel="noopener">${esc(team.name)}</a>`
    : `<span class="team-link">${esc(team.name)}</span>`;
  const subParts = [
    team.gcPos ? t('teamClsLine')(team.gcPos, team.gcGap||team.gcVal) : t('teamClsNone'),
    team.nat || ''
  ].filter(Boolean);
  return `<div class="team-card" style="${cardBorderStyle(i, n)}">
    <div class="team-head">
      <span class="team-rank${team.gcPos===1?' first':''}">${esc(team.gcPos||'–')}</span>
      <span class="team-meta">${nameHTML}<span class="team-clsline">${esc(subParts.join(' · '))}</span></span>
    </div>
    <table class="riders">
      <thead><tr>
        <th>${t('colBib')}</th><th>${t('colRider')}</th>
        <th>${t('colGcPos')}</th><th>${t('colGcTime')}</th>
      </tr></thead>
      <tbody>${team.riders.map(riderRowHTML).join('')}</tbody>
    </table>
  </div>`;
}

function renderTeams(){
  const grid = document.getElementById('teamsGrid');
  if(!RIDERS || !Array.isArray(RIDERS.teams) || !RIDERS.teams.length){
    grid.innerHTML = `<div class="status-card">${esc(t('teamsEmpty'))}</div>`;
    return;
  }
  const out = RIDERS.riderCount - RIDERS.finishers;
  const statusHTML = `<div class="teamsstatus">${esc(t('teamsStatus')(RIDERS.riderCount, RIDERS.teamCount, RIDERS.finishers, out))}</div>`;
  const cardsHTML = RIDERS.teams.map((team,i)=>teamCard(team, i, RIDERS.teams.length)).join('');
  grid.innerHTML = statusHTML + `<div class="clsgrid">${cardsHTML}</div>`;
}

/* ---------- STATIC TEXT + FULL RENDER ---------- */
function render(){
  document.getElementById('backLinkText').textContent = t('backToTours');
  document.getElementById('eyebrow').textContent = t('eyebrow');
  document.getElementById('subDesc').textContent = t('subDesc');
  document.getElementById('finalTag').textContent = t('finalTag');
  document.getElementById('tabStages').textContent = t('tabStages');
  document.getElementById('tabResults').textContent = t('tabResults');
  document.getElementById('tabTeams').textContent = t('tabTeams');
  document.getElementById('stageListHeader').textContent = t('stageListHeader');
  document.getElementById('disclaimerLabel').textContent = t('disclaimerLabel');
  document.getElementById('disclaimerText').textContent = t('disclaimerText');
  document.getElementById('profileDisclaimer').textContent = t('profileDisclaimer');
  document.getElementById('sourcesLabel').textContent = t('sourcesLabel');
  document.getElementById('sourcesText').textContent = t('sourcesText');
  document.getElementById('footerNote').textContent = t('footerNote');

  renderStageList();
  renderPanel(stages[activeIdx]);
  renderResults();
  renderTeams();

  document.querySelectorAll('#langSel button').forEach(b=>{
    const active = b.dataset.lang===lang;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  document.documentElement.lang = lang;
  syncStageListHeight();
}

document.querySelectorAll('#langSel button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    lang = btn.dataset.lang;
    localStorage.setItem(LANG_KEY, lang);
    render();
  });
});

/* ---------- TAB SWITCHING (WAI-ARIA tabs pattern) ---------- */
const tabButtons = Array.from(document.querySelectorAll('.tabbtn'));

tabButtons.forEach((tab, i)=>{
  tab.addEventListener('click', ()=>activateTab(tab, false));
  tab.addEventListener('keydown', e=>{
    let idx = null;
    if(e.key==='ArrowRight' || e.key==='ArrowDown') idx = (i+1) % tabButtons.length;
    else if(e.key==='ArrowLeft' || e.key==='ArrowUp') idx = (i-1+tabButtons.length) % tabButtons.length;
    else if(e.key==='Home') idx = 0;
    else if(e.key==='End') idx = tabButtons.length-1;
    if(idx!==null){ e.preventDefault(); activateTab(tabButtons[idx], true); }
  });
});

/* ---------- DATA LOADING ---------- */
async function load(){
  try{
    const resp = await fetch(DATA_URL, {cache:'no-store'});
    if(resp.ok) RESULTS = await resp.json();
  }catch(e){ /* file:// or offline — winners/standings simply blank */ }
  try{
    const resp = await fetch(RIDERS_URL, {cache:'no-store'});
    if(resp.ok){
      const data = await resp.json();
      if(data && Array.isArray(data.teams)) RIDERS = data;
    }
  }catch(e){ /* file:// or offline — the teams view shows its note */ }
  render();
}
load();
</script>
