/* YYYY-MM-DD for the visitor's local date, comparable against stage.date
   strings. Shared by todayStageIndex() and the weather gate (stageHasEnded). */
function todayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ---------- ILLUSTRATIVE PROFILE (built from climb positions) ---------- */
function climbHeight(c){ const gain=(c.len||4)*(c.grad||5); return Math.max(40, Math.min(95, 36 + gain*0.4)); }
function genProfile(st){
  const cs=climbsWithKm(st);
  if(st.type==='itt' || !cs.length) return genericProfile(st);
  const total=st.km, pts=[[0,18]];
  let last=0;
  cs.forEach(c=>{
    const foot=Math.max(last+1, Math.max(1, c.km-(c.len||4)));
    if(foot>last+1) pts.push([+foot.toFixed(1),22]);
    pts.push([c.km, climbHeight(c)]);
    if(c.km < total-4) pts.push([+Math.min(total, c.km+Math.max(3,(c.len||4)*0.5)).toFixed(1),28]);
    last=c.km;
  });
  const lastPt=pts[pts.length-1];
  if(lastPt[0] < total-0.5) pts.push([total, st.summit?90:18]);
  else if(st.summit) lastPt[1]=Math.max(lastPt[1],90);
  const out=[];
  pts.forEach(p=>{
    const x=+Math.max(0,Math.min(total,p[0])).toFixed(1);
    if(out.length && x===out[out.length-1][0]) out[out.length-1][1]=Math.max(out[out.length-1][1],p[1]);
    else if(!out.length || x>out[out.length-1][0]) out.push([x,p[1]]);
  });
  return out;
}
function buildPath(points,totalKm,W,H,padL,padR,padT,padB){
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xs=points.map(p=>padL+(p[0]/totalKm)*plotW);
  const ys=points.map(p=>padT+plotH-(p[1]/100)*plotH);
  let d=`M ${xs[0]},${ys[0]}`;
  for(let i=1;i<xs.length;i++){ const mx=(xs[i-1]+xs[i])/2; d+=` Q ${xs[i-1]},${ys[i-1]} ${mx},${(ys[i-1]+ys[i])/2}`; }
  d+=` L ${xs[xs.length-1]},${ys[ys.length-1]}`;
  return {d,plotH};
}
function xForKm(km,totalKm,W,padL,padR){ return padL+(km/totalKm)*(W-padL-padR); }

/* ---------- ELEVATION PROFILE ----------
   Styled per the Modernist system (shared with tdf2026.html / giro2026.html):
   monochrome ink line/fill, accent-shade climb bands. Only climbs with a
   known summit km get a marker, matching climbsWithKm above. Intermediate
   sprints (st.sprints) get a dashed green marker with a small flag, same
   shape as the climb/KOM marker but in SPRINT_COLOR so the two stay visually
   distinct. */
function renderProfile(st){
  const W=900, H=250, padL=30, padR=16, padT=22, padB=30;
  const {d, plotH} = buildPath(genProfile(st), st.km, W,H,padL,padR,padT,padB);
  const baseY = padT+plotH;

  let svg = `<svg class="profile" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(t('profileAria')(st.n))}">`;

  for(let g=0; g<=4; g++){
    const gy = padT + plotH*g/4;
    svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--color-neutral-300)" stroke-width="1"/>`;
  }
  const step = st.km > 150 ? 50 : (st.km > 60 ? 20 : 10);
  for(let k=0; k<=st.km+0.01; k+=step){
    const kx = xForKm(k, st.km, W, padL, padR);
    svg += `<line x1="${kx}" y1="${padT}" x2="${kx}" y2="${baseY}" stroke="var(--color-neutral-200)" stroke-width="1"/>`;
    svg += `<text x="${kx}" y="${H-10}" font-family="Archivo, sans-serif" font-size="11" font-weight="600" fill="var(--color-neutral-600)" text-anchor="middle">${Math.round(k)}</text>`;
  }

  climbsWithKm(st).forEach(c=>{
    const cx = xForKm(c.km, st.km, W, padL, padR);
    const foot = xForKm(Math.max(0, c.km-(c.len||4)), st.km, W, padL, padR);
    const col = CAT_COLOR[c.cat] || UNCAT_COLOR;
    svg += `<rect x="${foot}" y="${padT}" width="${Math.max(2,cx-foot)}" height="${plotH}" fill="${col}" opacity="0.18"/>`;
    svg += `<line x1="${cx}" y1="${padT}" x2="${cx}" y2="${baseY}" stroke="${col}" stroke-width="2"/>`;
    svg += `<rect x="${cx-4}" y="${padT-12}" width="8" height="8" fill="${col}"/>`;
  });

  svg += `<path d="${d} L ${xForKm(st.km,st.km,W,padL,padR)},${baseY} L ${padL},${baseY} Z" fill="var(--color-text)" opacity="0.1"/>`;
  svg += `<path d="${d}" fill="none" stroke="var(--color-text)" stroke-width="2.5" stroke-linejoin="round"/>`;

  (st.sprints||[]).forEach(s=>{
    const sx = xForKm(s.km, st.km, W, padL, padR);
    const top = padT + plotH*0.28;
    svg += `<line x1="${sx}" y1="${top}" x2="${sx}" y2="${baseY}" stroke="${SPRINT_COLOR}" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    svg += `<path d="M ${sx} ${top} L ${sx+14} ${top+5} L ${sx} ${top+10} Z" fill="${SPRINT_COLOR}"/>`;
  });

  svg += `<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--color-text)" stroke-width="2"/>`;
  svg += `</svg>`;
  return svg;
}

const ZOOM_LABELS = {fi:{in:'Lähennä',out:'Loitonna'}, fr:{in:'Zoom avant',out:'Zoom arrière'}, en:{in:'Zoom in',out:'Zoom out'}};

/* ---------- REAL ROUTE MAP (Leaflet + Stadia Maps) ----------
   Per-stage route polylines live in data/vuelta2026-routes.json. Stages
   missing a route fall back to a straight start→finish line derived from
   STAGE_COORDS. Same restyled-Leaflet approach as the Tour de France / Giro
   pages: the map is a real interactive tile map, shown small inline in the
   detail grid or expanded full-width, with a control-row chrome. */
let routesData = null, routesPromise = null;

let stageMap = null, stageMapFitBounds = null;

function initStageMap(st){
  if(!window.L){ setTimeout(()=>initStageMap(st), 120); return; }
  const el = document.getElementById('stage-map');
  if(!el) return;
  destroyStageMap();

  const map = L.map(el, {scrollWheelZoom:false, attributionControl:true, zoomControl:false});
  stageMap = map;
  L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', {
    maxZoom:17,
    attribution:'&copy; <a href="https://www.stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.on('zoomend', updateMapZoomLabel);

  const css = getComputedStyle(document.documentElement);
  const INK = css.getPropertyValue('--color-text').trim() || '#201e1d';
  const ACCENT = css.getPropertyValue('--color-accent').trim() || '#ec3013';

  const draw = () => {
    if(stageMap !== map) return;
    const pts = (routesData.stages || {})[st.n];
    const c = STAGE_COORDS[st.n];
    let line, startLL, finishLL, approx = false;
    if(pts && pts.length){
      line = pts; startLL = pts[0]; finishLL = pts[pts.length-1];
    }else{
      approx = true;
      startLL = [c[0][1], c[0][0]];
      finishLL = [c[1][1], c[1][0]];
      line = [startLL, finishLL];
    }
    const poly = L.polyline(line, approx
      ? {color:INK, weight:3, opacity:.85, dashArray:'6,8'}
      : {color:INK, weight:3.5, opacity:.95}).addTo(map);
    const same = Math.abs(startLL[0]-finishLL[0])<1e-4 && Math.abs(startLL[1]-finishLL[1])<1e-4;
    if(!same){
      L.circleMarker(startLL, {radius:6, color:'#fff', weight:2, fillColor:INK, fillOpacity:1}).addTo(map);
    }
    L.circleMarker(finishLL, {radius:7, color:'#fff', weight:2, fillColor:ACCENT, fillOpacity:1}).addTo(map);
    map.fitBounds(poly.getBounds(), {padding:[24,24]});
    map.invalidateSize();
    stageMapFitBounds = () => { if(stageMap===map) map.fitBounds(poly.getBounds(), {padding:[24,24]}); };
    const cap = document.getElementById('stage-map-caption');
    if(cap) cap.textContent = approx ? t('minimapCaptionApprox') : t('minimapCaption');
    updateMapZoomLabel();
  };

  if(routesData) draw(); else loadRoutes().then(()=>{ if(stageMap===map) draw(); });
  setTimeout(()=>{ if(stageMap===map) map.invalidateSize(); }, 60);
}

function mapControlsHTML(big){
  const zl = ZOOM_LABELS[lang] || ZOOM_LABELS.en;
  let html =
    `<button class="mapctrl-btn" data-map-zoomout title="${zl.out}" aria-label="${zl.out}">−</button>` +
    `<button class="mapctrl-btn" data-map-zoomin title="${zl.in}" aria-label="${zl.in}">+</button>` +
    `<button class="mapctrl-btn" data-map-recenter title="${esc(t('minimapRecenter'))}" aria-label="${esc(t('minimapRecenter'))}">◎</button>`;
  html += big
    ? `<button class="mapctrl-btn mapctrl-close" data-map-toggle title="${esc(t('minimapCollapse'))}" aria-label="${esc(t('minimapCollapse'))}">×</button>`
    : `<button class="mapctrl-btn" data-map-toggle title="${esc(t('minimapExpand'))}" aria-label="${esc(t('minimapExpand'))}">⤢</button>`;
  return html;
}

function bindMapControls(st){
  const zoomOutBtn = document.querySelector('[data-map-zoomout]');
  const zoomInBtn = document.querySelector('[data-map-zoomin]');
  const recenterBtn = document.querySelector('[data-map-recenter]');
  const toggleBtn = document.querySelector('[data-map-toggle]');
  if(zoomOutBtn) zoomOutBtn.addEventListener('click', ()=>{ if(stageMap) stageMap.zoomOut(); });
  if(zoomInBtn) zoomInBtn.addEventListener('click', ()=>{ if(stageMap) stageMap.zoomIn(); });
  if(recenterBtn) recenterBtn.addEventListener('click', ()=>{ if(stageMapFitBounds) stageMapFitBounds(); });
  if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
    mapExpanded = !mapExpanded;
    renderPanel(st);
    syncStageListHeight();
  });
}

/* ---------- STAGE LIST ---------- */
let activeIdx = 0;
function renderStageList(){
  const listEl=document.getElementById('stageList');
  const stagelayout = document.querySelector('.stagelayout');
  const panel = document.getElementById('panel');
  if(panel && stagelayout && listEl.contains(panel)) stagelayout.appendChild(panel);
  listEl.innerHTML='';
  stages.forEach((s,idx)=>{
    const li=document.createElement('li'); li.className='stage-item';
    if(s.n==='rest'){
      const div=document.createElement('div'); div.className='rest-row';
      div.textContent=`${fmtDate(s.date)} · ${t('restDay')}`;
      li.appendChild(div); listEl.appendChild(li); return;
    }
    const btn=document.createElement('button');
    btn.className='stage-btn'+(idx===activeIdx?' active':'');
    btn.dataset.idx=idx;
    const listWx = stageHasEnded(s) ? wxFor(s.n) : null;
    btn.innerHTML=`
      <span class="num">${String(s.n).padStart(2,'0')}</span>
      <span class="btn-text">
        <span class="btn-route">${esc(s.start)} → ${esc(s.finish)}</span>
        <span class="btn-meta">${fmtDate(s.date)} · ${fmtKm(s.km)} · ${t('typeLabels')[s.type]}</span>
      </span>
      <span class="btn-wx">${listWx ? `${listWx.start.temp}° → ${listWx.finish.temp}°` : ''}</span>`;
    btn.addEventListener('click',()=>selectStage(idx));
    li.appendChild(btn); listEl.appendChild(li);
  });
  positionPanel();
}

/* Keeps the stage-rail column exactly as tall as the detail panel next to
   it — see the equivalent comment in tdf2026.html. Skipped below 980px. */
function syncStageListHeight(){
  const list=document.querySelector('.stagerail');
  const panel=document.getElementById('panel');
  if(!list||!panel) return;
  if(window.innerWidth<=980){ list.style.height=''; return; }
  list.style.height=panel.offsetHeight+'px';
}
window.addEventListener('resize', ()=>{ syncStageListHeight(); positionPanel(); });

/* Below the 980px breakpoint the detail panel has no side column to live in,
   so it's moved into the stage list right after the selected stage's row —
   otherwise it renders below the entire list, far from the row that opened
   it. Above the breakpoint it moves back into its own grid column. */

function selectStage(idx){
  activeIdx=idx;
  document.querySelectorAll('.stage-btn').forEach(b=>b.classList.toggle('active',+b.dataset.idx===idx));
  const b=document.querySelector(`.stage-btn[data-idx="${idx}"]`); if(b) b.scrollIntoView({block:'nearest'});
  renderPanel(stages[idx]);
  positionPanel();
  syncStageListHeight();
}

/* ---------- WEATHER ----------
   Actual race-day weather loaded from data/vuelta2026-weather.json, fetched
   by scripts/fetch_weather.py (Open-Meteo's historical archive) on the same
   schedule as results. Only stages whose race day has already passed are
   ever written there, but the page re-checks the date itself too, so a
   stage in progress never shows a partial/estimated reading. */
let WEATHER = null;

function stageHasEnded(st){
  return st.n !== 'rest' && st.date < todayKey();
}

function wxCellHTML(d, kicker){
  const conds = t('wxConds'), dirs = t('wxDirs');
  const rows = [
    {label: t('wxLow'), value: `${d.low}°`},
    {label: t('wxWind'), value: `${d.wind} km/h ${dirs[d.dir] || d.dir}`},
    {label: t('wxRain'), value: d.precip ? `${d.precip.toLocaleString(localeTag())} mm` : '—'},
    {label: t('wxHumidity'), value: `${d.humidity} %`}
  ];
  if(d.alt) rows.push({label: t('wxAlt'), value: fmtGain(d.alt)});
  return `
    <div class="wxcell">
      <div class="wxhead">
        <span class="wxkicker">${kicker}</span>
        <span class="wxplace">${esc(d.town)}</span>
      </div>
      <div class="wxtempline">
        <span class="wxtemp">${d.temp}°</span>
        <div class="wxcondwrap">
          <span class="wxcond">${conds[d.cond] || d.cond}</span>
          <span class="wxfeels">${t('wxFeels')} ${d.feels}°</span>
        </div>
      </div>
      <div class="wxrows">
        ${rows.map(r=>`<div class="wxrowitem"><span class="label">${r.label}</span><span class="value">${r.value}</span></div>`).join('')}
      </div>
    </div>`;
}

function wxSectionHTML(st){
  if(!stageHasEnded(st)) return '';
  const w = wxFor(st.n);
  let deltaHTML = '';
  if(w){
    const diff = w.finish.temp - w.start.temp;
    const sign = diff > 0 ? '+' : diff < 0 ? '−' : '±';
    deltaHTML = `
      <span class="wxdelta">
        <span class="value">${sign}${Math.abs(diff)} °C</span>
        <span class="unit">${t('wxDelta')}</span>
      </span>`;
  }
  return `
    <div class="wxrow">
      <span class="label">${t('wxHeader')}</span>
      ${deltaHTML}
    </div>
    ${w
      ? `<div class="wxgrid">${wxCellHTML(w.start, t('wxAtStart'))}${wxCellHTML(w.finish, t('wxAtFinish'))}</div>
         <p class="wxnote"><span>${t('wxNote')}</span></p>`
      : `<p class="wxnodata">${t('wxNoData')}</p>`}
  `;
}

/* ---------- RANKINGS ----------
   Live standings from data/vuelta2026-results.json -- see
   scripts/fetch_results.py, which scrapes lavuelta.es and is refreshed on a
   schedule (see .github/workflows/update-results.yml). RESULTS starts empty
   and is populated by loadResults() below; classifications/stage results
   that have not been raced yet simply render their empty state. */
const RESULTS = {
  updated: null,
  afterStage: 0,
  gc:       {rows: []}, // Red jersey — general classification (time)
  points:   {rows: []}, // Points classification
  mountains:{rows: []}, // Mountains classification
  youth:    {rows: []}, // White jersey — young rider classification (time)
  teams:    {rows: []}, // Team classification (time)
  stageResults: {},
  stageWinners: stages.filter(s=>s.n!=='rest').map(s=>({n:s.n, route:`${s.start} → ${s.finish}`, winner:''})),
};

const expandState = {};
let rankView = 'general'; // 'general' or the selected stage number
const STAGE_STAT_KEYS = ['points','mountains','youth','teams'];

/* Per-card divider borders in a 2-col grid: right rule on the left card of
   each pair, bottom rule on every row but the last. Shared by the results
   classification cards and the team cards on the Teams tab. */

/* HTML for a single result row (shared by classifications and stage results).
   The card head (name + swatch) carries the classification's context, so
   only the rows are markup here — no header row. */
function resultRowHTML(r){
  return `
    <tr class="${r.pos<=3?'podium':''}">
      <td class="pos">${r.pos}</td>
      <td class="rider"><span class="rname">${esc(r.rider)}</span>${r.team?`<span class="rteam">${esc(r.team)}${r.nat?' · '+esc(r.nat):''}</span>`:''}</td>
      <td class="val">${r.gap!==undefined && r.pos>1 ? esc(r.gap) : esc(r.val)}</td>
    </tr>`;
}

/* Stages selectable in the dropdown: those with result rows or a known winner. */

function renderRankSelect(){
  const sel = document.getElementById('rankStageSelect');
  const ridden = riddenStages();
  const valid = rankView==='general' || ridden.some(s=>String(s.n)===String(rankView));
  if(!valid) rankView = 'general';

  let opts = `<option value="general">${esc(t('rankGeneral'))}</option>`;
  ridden.forEach(s=>{
    opts += `<option value="${s.n}">${esc(t('rankStageOpt')(s.n, s.route))}</option>`;
  });
  sel.innerHTML = opts;
  sel.value = String(rankView);
}

function renderResults(){
  renderRankSelect();
  document.getElementById('resultsStatusLine').textContent = RESULTS.updated ? fmtUpdated(RESULTS.updated) : '';
  if(rankView==='general') renderGeneralRankings();
  else renderStageResult(rankView);
}

function renderGeneralRankings(){
  const grid = document.getElementById('resultsGrid');
  const anyData = CLASS_KEYS.some(k=>RESULTS[k].rows.length>0);
  let statusHTML = '';

  if(!anyData){
    statusHTML = `<div class="status-card">${t('resultsEmpty')}</div>`;
  } else if(RESULTS.updated){
    statusHTML = `<div class="status-card">${t('resultsStatus')(RESULTS.updated, RESULTS.afterStage)}</div>`;
  }

  let cardsHTML = '';
  CLASS_KEYS.forEach((key,i)=>{
    const c = t('classifications')[key];
    const rows = RESULTS[key].rows;
    const expanded = !!expandState[key];
    const shown = expanded ? rows : rows.slice(0,10);

    let body;
    if(!rows.length){
      body = `<p class="empty-cls">${t('classEmpty')}</p>`;
    } else {
      body = `<table class="results"><tbody>${shown.map(resultRowHTML).join('')}</tbody></table>`;
      if(rows.length>10){
        body += `<button class="expander" data-cls="${key}">${expanded ? t('expandLess') : t('expandMore')(rows.length)}</button>`;
      }
    }

    cardsHTML += `<div class="cls-card" style="${cardBorderStyle(i, CLASS_KEYS.length)}">
      <div class="cls-head">
        <span class="names"><span class="name">${esc(c.name)}</span><span class="fr">${esc(c.fr)}</span></span>
        <span class="swatch" style="background:${JERSEY[key]}"></span>
      </div>
      <div class="cls-body">${body}</div>
    </div>`;
  });

  const ridden = RESULTS.stageWinners.filter(s=>s.winner);
  const winnersHTML = `<div class="stagewins-block">
    <span style="display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-3)">
      <h3>${t('stageWinnersTitle')}</h3>
      <span class="stagewins-meta">${t('stageWinnersFr')(ridden.length)}</span>
    </span>
    <table class="winners"><tbody>${RESULTS.stageWinners.map(s=>{
      const spd = stageAvgSpeed(s.n);
      return `<tr>
        <td class="n">${s.n}</td>
        <td class="route">${esc(s.route)}</td>
        <td class="winner">${s.cancelled ? esc(t('stageCancelledLabel')) : (esc(s.winner) || '—')}</td>
        <td class="speed">${spd ? fmtSpeed(spd) : '—'}</td>
      </tr>`;
    }).join('')}</tbody></table>
  </div>`;

  const allWd = [];
  RESULTS.stageWinners.forEach(s=>{
    const sr = RESULTS.stageResults[s.n];
    (sr && Array.isArray(sr.withdrawals) ? sr.withdrawals : []).forEach(w=>allWd.push(Object.assign({stage:s.n}, w)));
  });
  const wdBody = !allWd.length
    ? `<p class="empty-cls">${t('noWithdrawalsRace')}</p>`
    : `<table class="results"><tbody>${allWd.map(w=>`
        <tr>
          <td class="pos">${w.stage}</td>
          <td class="rider"><span class="rname">${esc(w.rider)}</span>${w.team?`<span class="rteam">${esc(w.team)}</span>`:''}</td>
          <td class="val">${esc(t('withdrawalReasons')[w.reason] || w.reason)}</td>
        </tr>`).join('')}</tbody></table>`;
  const withdrawalsHTML = `<div class="stagewins-block">
    <span style="display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-3)">
      <h3>${t('allWithdrawalsTitle')}</h3>
      <span class="stagewins-meta">${t('allWithdrawalsFr')(allWd.length)}</span>
    </span>
    ${wdBody}
  </div>`;

  grid.innerHTML = statusHTML + `<div class="clsgrid">${cardsHTML}</div>` + winnersHTML + withdrawalsHTML;
  bindExpanders(grid);
}

/* A single stage: finishing order + the stage's other statistics (points and
   mountains points won, youth and team stage results, combativity, withdrawals). */
function renderStageResult(n){
  const grid = document.getElementById('resultsGrid');
  const sr = RESULTS.stageResults[n] || {};
  const rows = Array.isArray(sr.rows) ? sr.rows : [];
  const meta = RESULTS.stageWinners.find(s=>String(s.n)===String(n));
  const route = meta ? meta.route : '';

  const mainBody = sr.cancelled
    ? `<div class="status-card">${esc(t('stageCancelledDetail')(t('cancelledReasons')[sr.cancelledReason] || ''))}</div>`
    : (rows.length ? stageStatTable(rows, '__stage') : `<p class="empty-cls">${t('stageResultEmpty')}</p>`);
  const spd = stageAvgSpeed(n);
  const sub = route + (spd ? ` · ${t('avgSpeed')(fmtSpeed(spd))}` : '');
  const mainHTML = `<div class="cls-card" style="border-bottom:2px solid var(--color-divider)">
    <div class="cls-head">
      <span class="names"><span class="name">${esc(t('stageResultTitle')(n))}</span><span class="fr">${esc(sub)}</span></span>
      <span class="swatch" style="background:${AUX_SWATCH.winners}"></span>
    </div>
    <div class="cls-body">${mainBody}</div>
  </div>`;

  let cardsHTML = '';
  if(rows.length){
    const cards = [];
    STAGE_STAT_KEYS.forEach(key=>{
      const c = t('stageStats')[key];
      const data = Array.isArray(sr[key]) ? sr[key] : [];
      let body;
      if(key==='points' || key==='mountains'){
        // Sectioned: one sub-table per intermediate sprint / categorized
        // climb, each with its own optional caption (sec.label).
        body = !data.length
          ? `<p class="empty-cls">${t('stageStatEmpty')}</p>`
          : data.map((sec,i)=>
              (sec.label?`<div class="sec-label">${esc(sec.label)}</div>`:'') +
              stageStatTable(sec.rows||[], `__stage_${key}_${i}`)
            ).join('');
      } else {
        body = stageStatTable(data, '__stage_'+key);
      }
      cards.push({name:c.name, fr:c.fr, swatch:JERSEY[key], body});
    });

    const cc = t('stageStats').combative;
    const comb = sr.combative;
    const combBody = comb && comb.rider
      ? `<table class="results"><tbody>${resultRowHTML({pos:1, rider:comb.rider, team:comb.team, nat:comb.nat, val:''})}</tbody></table>`
      : `<p class="empty-cls">${t('stageStatEmpty')}</p>`;
    cards.push({name:cc.name, fr:cc.fr, swatch:AUX_SWATCH.combative, body:combBody});

    const wt = t('stageStats').withdrawals;
    const wd = Array.isArray(sr.withdrawals) ? sr.withdrawals : [];
    const wBody = !wd.length
      ? `<p class="empty-cls">${t('noWithdrawals')}</p>`
      : `<table class="results"><tbody>${wd.map(w=>`
          <tr>
            <td class="pos">${w.bib}</td>
            <td class="rider"><span class="rname">${esc(w.rider)}</span>${w.team?`<span class="rteam">${esc(w.team)}</span>`:''}</td>
            <td class="val">${esc(t('withdrawalReasons')[w.reason] || w.reason)}</td>
          </tr>`).join('')}</tbody></table>`;
    cards.push({name:wt.name, fr:wt.fr, swatch:AUX_SWATCH.withdrawals, body:wBody});

    cardsHTML = cards.map((c,i)=>`<div class="cls-card" style="${cardBorderStyle(i, cards.length)}">
      <div class="cls-head">
        <span class="names"><span class="name">${esc(c.name)}</span><span class="fr">${esc(c.fr)}</span></span>
        <span class="swatch" style="background:${c.swatch}"></span>
      </div>
      <div class="cls-body">${c.body}</div>
    </div>`).join('');
  }

  grid.innerHTML = mainHTML + (cardsHTML ? `<div class="clsgrid">${cardsHTML}</div>` : '');
  bindExpanders(grid);
}

/* ---------- TEAMS & RIDERS ----------
   The start list (23 teams x 8 riders) from data/vuelta2026-riders.json --
   see scripts/fetch_riders.py. Teams are stored in team-classification
   order (once the classification exists), riders in bib order. */
let RIDERS = null;

function riderRowHTML(r){
  const out = !!r.status;
  const sub = out
    ? `${t('withdrawalReasons')[r.status] || r.status} · ${r.statusStage ? t('riderOutOnStage')(r.statusStage) : t('riderOutUnknown')}`
    : (r.nat || '');
  const gcPos = out ? '—' : (r.gcPos || '—');
  const val = out ? '' : (r.gcGap || r.gcVal || '');
  return `
    <tr class="${out ? 'out' : (r.gcPos && r.gcPos<=3 ? 'podium' : '')}">
      <td class="bib">${r.bib ?? ''}</td>
      <td class="rider"><span class="rname">${esc(r.name)}</span>${sub?`<span class="rsub">${esc(sub)}</span>`:''}</td>
      <td class="gcpos">${gcPos}</td>
      <td class="val">${esc(val)}</td>
    </tr>`;
}

function renderRiders(){
  const grid = document.getElementById('teamsGrid');
  if(!RIDERS || !Array.isArray(RIDERS.teams) || !RIDERS.teams.length){
    grid.innerHTML = `<div class="status-card">${t('teamsEmpty')}</div>`;
    return;
  }

  const out = RIDERS.riderCount - RIDERS.finishers;
  const statusHTML = `<div class="teamsstatus">${t('teamsStatus')(RIDERS.riderCount, RIDERS.teamCount, RIDERS.finishers, out)}</div>`;

  const cardsHTML = RIDERS.teams.map((team,i)=>{
    const nameHTML = team.url
      ? `<a class="team-link" href="${team.url}" target="_blank" rel="noopener">${esc(team.name)}</a>`
      : `<span class="team-link">${esc(team.name)}</span>`;
    const sub = team.gcPos
      ? t('teamClsLine')(team.gcPos, team.gcGap || team.gcVal)
      : t('teamClsNone');
    return `<div class="team-card" style="${cardBorderStyle(i, RIDERS.teams.length)}">
      <div class="team-head">
        <span class="team-rank${team.gcPos===1?' first':''}">${team.gcPos || '–'}</span>
        <span class="team-meta">${nameHTML}<span class="team-clsline">${esc(sub)}</span></span>
      </div>
      <table class="riders">
        <thead><tr>
          <th>${t('colBib')}</th><th>${t('colRider')}</th>
          <th>${t('colGcPos')}</th><th>${t('colGcTime')}</th>
        </tr></thead>
        <tbody>${team.riders.map(riderRowHTML).join('')}</tbody>
      </table>
    </div>`;
  }).join('');

  grid.innerHTML = statusHTML + `<div class="clsgrid">${cardsHTML}</div>`;
}

/* Live standings for the "Rankings" tab. Missing file (e.g. the page was
   opened over file://, or fetched before the race has any results) leaves
   the built-in empty RESULTS state in place. */
async function loadResults(){
  try{
    const resp = await fetch(RESULTS_URL, {cache:'no-store'});
    if(!resp.ok) throw new Error('not found');
    const data = await resp.json();
    ['gc','points','mountains','youth','teams'].forEach(k=>{
      if(data[k] && Array.isArray(data[k].rows)) RESULTS[k].rows = data[k].rows;
    });
    if(data.stageResults && typeof data.stageResults==='object'){
      RESULTS.stageResults = data.stageResults;
    }
    if(Array.isArray(data.stageWinners)){
      data.stageWinners.forEach(w=>{
        const row = RESULTS.stageWinners.find(s=>s.n===w.n);
        if(!row) return;
        if(w.winner) row.winner = w.winner;
        if(w.cancelled){ row.cancelled = true; row.cancelledReason = w.cancelledReason; }
      });
    }
    if(data.updated) RESULTS.updated = data.updated;
    if(data.afterStage) RESULTS.afterStage = data.afterStage;
    renderResults();
  }catch(e){
    /* No automatic data available — show the built-in empty state. */
  }
}

/* Start list for the "Teams & riders" tab. Missing file (e.g. the page was
   opened over file://) leaves the status-card empty state in place. */
async function loadRiders(){
  try{
    const resp = await fetch(RIDERS_URL, {cache:'no-store'});
    if(!resp.ok) throw new Error('not found');
    const data = await resp.json();
    if(data && Array.isArray(data.teams)) RIDERS = data;
    renderRiders();
  }catch(e){
    /* No start list available — the view keeps showing t('teamsEmpty'). */
  }
}

/* Actual race-day weather (see the WEATHER block above). Missing
   file/stage leaves the panel showing nothing (future stage) or
   t('wxNoData') (ended stage not yet fetched). */
async function loadWeather(){
  try{
    const resp = await fetch(WEATHER_URL, {cache:'no-store'});
    if(!resp.ok) throw new Error('not found');
    const data = await resp.json();
    if(data && data.stages) WEATHER = data;
    renderStageList();
    renderPanel(stages[activeIdx]);
  }catch(e){
    /* No weather data available yet. */
  }
}

  lang=newLang;

  renderAll();

document.querySelectorAll('#langSel button').forEach(btn=>{
  btn.addEventListener('click',()=>setLang(btn.dataset.lang));

/* ---------- RANKINGS STAGE SELECTOR ---------- */
document.getElementById('rankStageSelect').addEventListener('change', e=>{
  rankView = e.target.value==='general' ? 'general' : Number(e.target.value);
  Object.keys(expandState).forEach(k=>{ if(k.startsWith('__stage')) delete expandState[k]; });
  renderResults();
});

/* ---------- TAB SWITCHING (WAI-ARIA tabs pattern) ---------- */
const tabButtons = Array.from(document.querySelectorAll('.tabbtn'));
tabButtons.forEach((tab, i)=>{
  tab.addEventListener('click', ()=>activateTab(tab, false));
  tab.addEventListener('keydown', e=>{
    let idx = null;
    if(e.key==='ArrowRight' || e.key==='ArrowDown') idx = (i+1) % tabButtons.length;
    else if(e.key==='ArrowLeft' || e.key==='ArrowUp') idx = (i-1+tabButtons.length) % tabButtons.length;
    else if(e.key==='Home') idx = 0;
    else if(e.key==='End') idx = tabButtons.length-1;
    if(idx!==null){ e.preventDefault(); activateTab(tabButtons[idx], true); }
  });
});

/* Defaults the Stages tab to whichever stage matches today's date, so a
   visitor lands on the stage actually being raced rather than always stage
   1. Rest days keep showing the last raced stage; before/after the race
   this resolves to the first/last stage. */
function todayStageIndex(){
  const key = todayKey();
  let idx = 0;
  for(let i=0;i<stages.length;i++){
    if(stages[i].n==='rest') continue;
    if(stages[i].date<=key) idx=i; else break;
  }
  return idx;
}

/* init */
document.documentElement.lang = lang;
activeIdx = todayStageIndex();
renderAll();
loadResults();
loadRiders();
loadWeather();
</script>
